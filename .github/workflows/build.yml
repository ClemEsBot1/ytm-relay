name: Build debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk music-relay.apk
      - uses: actions/upload-artifact@v4
        with:
          name: music-relay-debug
          path: music-relay.apk

      # Rolling "latest" release on main: direct APK download, no sign-in needed.
      - name: Publish latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest music-relay.apk \
            --title "Music Relay (latest build)" \
            --notes "Debug APK built from ${GITHUB_SHA::7}. Download music-relay.apk on your phone and install it." \
            --target "$GITHUB_SHA" --latest
